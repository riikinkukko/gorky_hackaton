# /etc/nginx/sites-available/voice.conf  →  ln -s ../sites-available/voice.conf /etc/nginx/sites-enabled/
# Замените VOICE_DOMAIN на поддомен (например voice.example.ru). Сертификат: certbot --nginx -d VOICE_DOMAIN
# SEC-03: лимиты по IP (зоны действуют только для этого сайта — соседнее приложение не затрагивают)
limit_req_zone $binary_remote_addr zone=voice_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=voice_conn:10m;
# реплики чата (/api/chat, /api/undo) — 30 в минуту на IP, не зависит от cookie и session_id
limit_req_zone $binary_remote_addr zone=voice_chat:10m rate=30r/m;

server {
    listen 80;
    server_name VOICE_DOMAIN;

    client_max_body_size 20m;          # аудио

    location /ws/ {
        limit_conn voice_conn 10;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location ~ ^/api/(chat|undo)$ {
        limit_req zone=voice_chat burst=10 nodelay;
        limit_req zone=voice_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=voice_req burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket /ws/voice
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
