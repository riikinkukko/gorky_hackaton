name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: ffmpeg (голосовые тесты)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy app
      - name: migrate + seed
        run: |
          psql postgresql://app:app@localhost:5432/app -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          alembic -c app/storage/alembic.ini upgrade head
          python -m app.cli import-csv ../data/voice_assistant_events_1000.csv --user 1
      - name: pytest (вкл. PostgreSQL и голос)
        run: pytest -q -rs
      - name: eval (настоящие модули)
        env:
          NLU_IMPL: real
          DIALOG_IMPL: real
          STORAGE_IMPL: postgres
        run: |
          python -m eval.run_eval eval/golden_eval.jsonl --min-recall 0.9 --out eval_report.md
          cat eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: сценарий демо (блокирует слияние)
        env:
          NLU_IMPL: real
          DIALOG_IMPL: real
          STORAGE_IMPL: postgres
          LLM_PROVIDER: rules
        run: |
          python -m eval.run_sessions ../qa/sessions/demo.jsonl --strict --no-chips --out demo_report.md
          cat demo_report.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: docker compose config -q && DOMAIN=example.ru docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: build images (без весов моделей)
        run: VOICE_MODELS=0 docker compose build api web

  security:
    # SEC-12: секреты в истории, уязвимые зависимости. Пока не блокирует (сначала разобрать находки).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (вся история)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --log-opts=--all --redact -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: backend
        run: pip install -q -e . pip-audit && pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev
