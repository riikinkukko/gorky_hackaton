name: Adversarial

# Состязательные реплики чата 9 (qa/adversarial) + оракулы — eval/run_adversarial.py.
# Отдельно от CI: идёт ~10 минут и не задерживает деплой. Пока не блокирует — это градусник.
# Без ключа LLM: фразы, где правила не уверены, идут в fallback — значение здесь нижняя граница.
on:
  push:
    branches: [main]
    paths: ["backend/app/**", "backend/eval/**", "qa/adversarial/**", "qa/sessions/**", ".github/workflows/adversarial.yml"]
  schedule:
    - cron: "17 3 * * *" # 06:17 МСК, до утренней сводки
  workflow_dispatch:

concurrency:
  group: adversarial
  cancel-in-progress: true

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      NLU_IMPL: real
      DIALOG_IMPL: real
      STORAGE_IMPL: postgres
      LLM_PROVIDER: rules
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: migrate + seed
        run: |
          psql postgresql://app:app@localhost:5432/app -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          alembic -c app/storage/alembic.ini upgrade head
          python -m app.cli import-csv ../data/voice_assistant_events_1000.csv --user 1
      - name: run
        run: |
          python -m eval.run_adversarial --out adv_report.md --json adv_rows.json
          cat adv_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: sessions (разговоры целиком + все кнопки)
        run: |
          python -m eval.run_sessions --out ses_report.md --json ses_rows.json
          cat ses_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial
          path: |
            backend/adv_report.md
            backend/adv_rows.json
            backend/ses_report.md
            backend/ses_rows.json
          retention-days: 14
