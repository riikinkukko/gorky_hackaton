name: gorky-voice

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        VOICE_MODELS: ${VOICE_MODELS:-1}
        # чат 4: лёгкий профиль собирается здесь (int8 готовится при сборке, Silero можно не класть)
        GIGAAM_MODEL: ${GIGAAM_MODEL:-v3_e2e_rnnt}
        GIGAAM_QUANTIZE: ${GIGAAM_QUANTIZE:-none}
        TTS_MODELS: ${TTS_MODELS:-1}
        VOICE_TORCH_THREADS: ${VOICE_TORCH_THREADS:-4}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      SEED_CSV: ${SEED_CSV:-/app/data/voice_assistant_events_1000.csv}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
