# Снимок backend/app/nlu/synonyms.yml (чат 1) на 21.10.2026 — только для тестов чата 3.
# Используется, пока в дереве нет app/nlu/synonyms.yml (ветка nlu/v1 не влита).
# Словарь синонимов для нормализации запросов.
# Ключ — каноническая форма (как в данных), значения — варианты из разговорной речи.
# Сравнение идёт по леммам (pymorphy3), регистр и ё не важны.

phrases:
  техническое задание: [тз, техзадание, тех задание, техничка, тэ зэ, тэзэ, тэ з, т з]
  мобильное приложение: [мобилка, мобильное приложение, приложение, мобильное, мобильная версия, апп, мобайл]
  коммерческое предложение: [кп, коммерческое, коммерческое предложение, коммерч, ка пэ, капэ]
  новый продукт: [новый продукт, новинка]
  обратная связь: [фидбэк, фидбек, обратная связь, отзывы]
  итоги встречи: [итоги, итоги встречи, саммари, резюме встречи]
  CRM: [crm, срм, црм, си ар эм]
  сайт: [сайт, лендинг, веб-сайт, вебсайт]
  презентация: [презентация, презентуха, през, презу, слайды, презуха]
  договор: [договор, контракт, договорчик]
  аналитика: [аналитика, отчётность по аналитике, метрики]
  интеграция: [интеграция, интеграции]
  хакатон: [хакатон, хак]
  протокол: [протокол]
  акт: [акт]
  смета: [смета]
  бюджет: [бюджет]

# Расширения: запрос со словом слева дополнительно ищет слова справа
expand:
  деньги: [бюджет, смета]
  финансы: [бюджет, смета]
  бабки: [бюджет, смета]
  оплата: [бюджет, смета, акт]
  стоимость: [смета]
  документы: [договор, акт, протокол]
  бумаги: [договор, акт, протокол]

# Глаголы: разговорная форма → глагол из заголовков данных
verbs:
  позвонить: [звонить, позвонить, звонил, набрать, созвониться, прозвонить, позвонил]
  отправить: [отправить, отослать, скинуть, прислать, выслать, переслать, отправлять, скидывать]
  проверить: [проверить, посмотреть, глянуть, проверять]
  подготовить: [подготовить, сделать, готовить, подготавливать]
  подготовиться: [подготовиться, готовиться, подготавливаться]
  согласовать: [согласовать, утвердить, согласовывать]
  обсудить: [обсудить, обговорить, обсуждать, перетереть]
  обновить: [обновить, актуализировать, обновлять]
  собрать: [собрать, собирать]
  передать: [передать, передавать]

# Слова, задающие тип записи
types:
  meeting: [встреча, встречаться, встретиться, созвон, демо, демонстрация, планёрка, планерка, совещание, летучка, собеседование, митинг, конференция, стендап, синк]
  reminder: [напоминание, напоминалка, напоминалочка]
  task: [задача, задачка, дело, таск, задание, поручение]

# Организации-контрагенты (из данных организаторов; расширяется под заказчика)
organizations: [Альфа, Вектор, Север, Орбита, Маяк, Партнёр, Пульс, Старт]

# Люди из данных: подсказка лемматизатору, когда имя написано строчными (STT)
people: [Алексей, Анна, Дмитрий, Елена, Иван, Максим, Мария, Наталья, Ольга, Сергей]
