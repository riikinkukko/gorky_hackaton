[project]
name = "voice-assistant"
version = "0.1.0"
description = "Голосовой ассистент для задач, напоминаний и встреч (Gorky Code)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "pgvector>=0.3",            # чат 3
    "pymorphy3>=2.0",           # чаты 1, 3
    "pymorphy3-dicts-ru>=2.4",
    "pyyaml>=6.0",              # synonyms.yml
    "httpx>=0.27",              # LLM-клиенты чата 1
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "types-PyYAML",
]
embeddings = ["sentence-transformers>=3.0"]  # bge-m3 для поиска (чат 3)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — это нормально

[tool.ruff.lint.per-file-ignores]
# Контракт хранится дословно как в документе 03 (несколько атрибутов enum в одной строке).
"app/contracts.py" = ["E701", "E702", "E501", "I001"]

[tool.ruff.format]
exclude = ["app/contracts.py"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["^tests/", "^eval/"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
